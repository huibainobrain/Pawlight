<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>星屿纪念 V1 HTML 原型</title>
  <style>
    :root {
      --paper: #f7f1e8;
      --paper-soft: #fbf7f0;
      --ink: #2e2b27;
      --muted: #736d64;
      --line: rgba(69, 59, 45, .14);
      --green: #7e9366;
      --green-deep: #526744;
      --blue: #6487a0;
      --blue-deep: #263449;
      --gold: #bd8f4d;
      --rose: #bf7d72;
      --white: #fffdfa;
      --shadow: 0 22px 60px rgba(50, 42, 30, .16);
      --radius: 8px;
      --tab-h: 74px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(247, 241, 232, .92), rgba(232, 238, 228, .86)),
        radial-gradient(circle at 15% 18%, rgba(255, 248, 219, .6), transparent 28%),
        linear-gradient(90deg, #edf2ec, #f7f1e8 52%, #e6eef2);
      letter-spacing: 0;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .workspace {
      min-height: 100%;
      display: grid;
      grid-template-columns: minmax(390px, 430px) minmax(300px, 360px);
      gap: 28px;
      align-items: center;
      justify-content: center;
      padding: 28px;
    }

    .phone {
      width: 390px;
      height: 844px;
      border-radius: 34px;
      padding: 12px;
      background: #1d211f;
      box-shadow: var(--shadow);
      position: relative;
    }

    .screen {
      height: 100%;
      overflow: hidden;
      border-radius: 26px;
      background: var(--paper);
      position: relative;
    }

    .statusbar {
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      color: rgba(44, 39, 34, .8);
      font-size: 12px;
      font-weight: 700;
      background: rgba(255, 253, 250, .78);
      border-bottom: 1px solid rgba(255, 255, 255, .4);
    }

    .status-icons {
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .signal,
    .battery {
      display: inline-block;
      height: 8px;
      border: 1px solid rgba(44, 39, 34, .65);
    }

    .signal {
      width: 14px;
      border-top-left-radius: 7px;
      border-top-right-radius: 7px;
      border-bottom: 0;
    }

    .battery {
      width: 20px;
      border-radius: 3px;
      position: relative;
    }

    .battery::after {
      content: "";
      position: absolute;
      right: -4px;
      top: 2px;
      width: 2px;
      height: 4px;
      border-radius: 1px;
      background: rgba(44, 39, 34, .65);
    }

    #app {
      height: calc(100% - 38px);
      position: relative;
      overflow: hidden;
    }

    .page {
      height: 100%;
      overflow-y: auto;
      background:
        linear-gradient(180deg, rgba(255, 253, 250, .9), rgba(247, 241, 232, .96) 46%, rgba(235, 241, 229, .72)),
        var(--paper);
      scrollbar-width: none;
    }

    .page::-webkit-scrollbar {
      display: none;
    }

    .page.with-tabs {
      padding-bottom: var(--tab-h);
    }

    .page.h5 {
      background:
        linear-gradient(180deg, #f8f4ed 0%, #edf3ec 62%, #f7f1e8 100%);
    }

    .content {
      padding: 18px 18px 24px;
    }

    .nav {
      position: sticky;
      top: 0;
      z-index: 5;
      display: grid;
      grid-template-columns: 38px 1fr 38px;
      align-items: center;
      gap: 8px;
      min-height: 52px;
      padding: 10px 14px 4px;
      background: linear-gradient(180deg, rgba(255, 253, 250, .96), rgba(255, 253, 250, .72));
      backdrop-filter: blur(16px);
    }

    .nav-title {
      text-align: center;
      font-weight: 750;
      font-size: 16px;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 18px;
      background: rgba(255, 255, 255, .7);
      color: var(--ink);
      border: 1px solid var(--line);
      display: grid;
      place-items: center;
      font-size: 22px;
      line-height: 1;
    }

    .logo-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .brand {
      font-size: 15px;
      font-weight: 800;
      color: rgba(46, 43, 39, .82);
    }

    .soft-tag {
      padding: 5px 9px;
      border-radius: 999px;
      background: rgba(126, 147, 102, .14);
      color: var(--green-deep);
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    h1 {
      font-size: 30px;
      line-height: 1.18;
      letter-spacing: 0;
      margin-top: 12px;
    }

    h2 {
      font-size: 21px;
      line-height: 1.28;
      margin-bottom: 10px;
    }

    h3 {
      font-size: 16px;
      line-height: 1.35;
      margin-bottom: 8px;
    }

    .muted {
      color: var(--muted);
      line-height: 1.65;
      font-size: 13px;
    }

    .small {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }

    .hero-copy {
      margin: 18px 0 20px;
    }

    .hero-copy .muted {
      margin-top: 10px;
      font-size: 14px;
    }

    .planet-window {
      position: relative;
      min-height: 300px;
      border-radius: 8px;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(34, 44, 68, .94), rgba(48, 73, 83, .86) 56%, rgba(119, 142, 110, .78)),
        linear-gradient(135deg, #273144, #7c9aa5);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .28);
      isolation: isolate;
    }

    .planet-window::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(110deg, rgba(255, 238, 191, .2), transparent 34%),
        linear-gradient(180deg, transparent 62%, rgba(226, 230, 196, .28)),
        repeating-radial-gradient(circle at 16% 18%, rgba(255, 255, 255, .45) 0 1px, transparent 1px 38px);
      opacity: .9;
      z-index: -1;
    }

    .planet-window::after {
      content: "";
      position: absolute;
      left: -8%;
      right: -8%;
      bottom: -32px;
      height: 120px;
      background:
        linear-gradient(180deg, rgba(235, 241, 217, .22), rgba(130, 157, 109, .9)),
        repeating-linear-gradient(100deg, rgba(255, 255, 255, .15) 0 2px, transparent 2px 18px);
      border-top-left-radius: 50% 70%;
      border-top-right-radius: 50% 70%;
    }

    .pet-photo {
      width: 178px;
      height: 178px;
      margin: 34px auto 16px;
      position: relative;
      border-radius: 8px;
      overflow: hidden;
      background:
        linear-gradient(145deg, rgba(255, 251, 238, .7), rgba(132, 157, 165, .28)),
        linear-gradient(180deg, #e7d5bd, #b4c5b2);
      border: 4px solid rgba(255, 253, 250, .68);
      box-shadow: 0 18px 34px rgba(20, 30, 42, .26);
      filter: hue-rotate(var(--photo-hue, 0deg));
    }

    .pet-photo::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(120deg, rgba(255, 255, 255, .45), transparent 36%),
        radial-gradient(circle at 50% 42%, rgba(74, 64, 55, .34) 0 24%, transparent 25%),
        radial-gradient(circle at 44% 50%, rgba(74, 64, 55, .55) 0 3px, transparent 4px),
        radial-gradient(circle at 57% 50%, rgba(74, 64, 55, .55) 0 3px, transparent 4px),
        radial-gradient(circle at 51% 58%, rgba(74, 64, 55, .36) 0 4px, transparent 5px),
        linear-gradient(180deg, transparent 62%, rgba(102, 132, 91, .42));
    }

    .pet-photo::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 12px;
      transform: translateX(-50%);
      padding: 5px 9px;
      border-radius: 999px;
      background: rgba(255, 253, 250, .78);
      color: rgba(46, 43, 39, .72);
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      display: none;
    }

    .pet-photo.upload-placeholder::after {
      content: "主照片占位";
      display: block;
    }

    .pet-photo.sm {
      width: 68px;
      height: 68px;
      margin: 0;
      border-width: 2px;
    }

    .pet-photo.sm::after {
      display: none;
    }

    .planet-caption {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 0 20px 18px;
      color: #fffdfa;
      text-shadow: 0 1px 12px rgba(0, 0, 0, .22);
    }

    .planet-caption .name {
      font-size: 24px;
      font-weight: 850;
      margin-bottom: 6px;
    }

    .planet-caption .line {
      font-size: 13px;
      line-height: 1.55;
      opacity: .9;
    }

    .cover-window {
      border-radius: 8px;
      overflow: hidden;
      min-height: 350px;
    }

    .cover-window .pet-photo {
      width: 210px;
      height: 210px;
      margin-top: 30px;
    }

    .card {
      background: rgba(255, 253, 250, .78);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px;
      box-shadow: 0 10px 28px rgba(74, 61, 45, .07);
    }

    .card + .card,
    .section + .section {
      margin-top: 12px;
    }

    .section {
      margin-top: 16px;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .section-title h3 {
      margin-bottom: 0;
    }

    .button-row {
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .primary,
    .secondary,
    .ghost,
    .danger,
    .quiet {
      min-height: 42px;
      border-radius: 999px;
      padding: 0 15px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-weight: 750;
      font-size: 14px;
      white-space: nowrap;
    }

    .primary {
      color: #fffdfa;
      background: linear-gradient(135deg, var(--green-deep), var(--blue));
      box-shadow: 0 10px 24px rgba(82, 103, 68, .22);
    }

    .secondary {
      color: var(--green-deep);
      background: rgba(126, 147, 102, .14);
      border: 1px solid rgba(126, 147, 102, .24);
    }

    .ghost {
      color: var(--ink);
      background: rgba(255, 253, 250, .72);
      border: 1px solid var(--line);
    }

    .quiet {
      min-height: 34px;
      color: var(--muted);
      background: transparent;
      padding: 0;
      border-radius: 0;
    }

    .danger {
      color: #8b413d;
      background: rgba(191, 125, 114, .13);
      border: 1px solid rgba(191, 125, 114, .22);
    }

    .wide {
      width: 100%;
    }

    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .field {
      margin-top: 14px;
    }

    .field label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
      font-weight: 700;
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      border: 1px solid rgba(69, 59, 45, .18);
      background: rgba(255, 253, 250, .84);
      border-radius: 8px;
      padding: 12px 12px;
      outline: none;
      color: var(--ink);
      resize: vertical;
    }

    .field textarea {
      min-height: 170px;
      line-height: 1.65;
    }

    .choice-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 8px;
    }

    .choice {
      min-height: 52px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: rgba(255, 253, 250, .75);
      display: grid;
      place-items: center;
      font-size: 13px;
      font-weight: 750;
      color: var(--ink);
    }

    .choice.active {
      border-color: rgba(126, 147, 102, .48);
      background: rgba(126, 147, 102, .15);
      color: var(--green-deep);
    }

    .progress {
      display: flex;
      gap: 5px;
      margin: 8px 0 18px;
    }

    .progress span {
      flex: 1;
      height: 4px;
      border-radius: 999px;
      background: rgba(69, 59, 45, .12);
    }

    .progress span.on {
      background: var(--green);
    }

    .upload-box {
      height: 280px;
      border-radius: 8px;
      border: 1px dashed rgba(82, 103, 68, .42);
      background:
        linear-gradient(180deg, rgba(255, 253, 250, .78), rgba(231, 237, 222, .76));
      display: grid;
      place-items: center;
      text-align: center;
      padding: 26px;
      color: var(--muted);
    }

    .upload-box.done {
      border-style: solid;
      padding: 0;
      overflow: hidden;
    }

    .upload-box.done .pet-photo {
      width: 100%;
      height: 100%;
      margin: 0;
      border: 0;
      border-radius: 8px;
    }

    .plan-list {
      display: grid;
      gap: 10px;
    }

    .plan {
      border: 1px solid var(--line);
      background: rgba(255, 253, 250, .82);
      border-radius: 8px;
      padding: 14px;
      position: relative;
    }

    .plan.featured {
      border-color: rgba(189, 143, 77, .5);
      background:
        linear-gradient(135deg, rgba(255, 248, 224, .86), rgba(255, 253, 250, .84));
    }

    .plan.disabled {
      opacity: .62;
    }

    .plan-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .price {
      color: var(--gold);
      font-weight: 850;
      font-size: 18px;
    }

    .price del {
      color: rgba(115, 109, 100, .7);
      font-size: 12px;
      margin-left: 4px;
      font-weight: 600;
    }

    .checks {
      display: grid;
      gap: 6px;
      margin: 10px 0;
      padding: 0;
      list-style: none;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .checks li::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      display: inline-block;
      background: var(--green);
      margin-right: 7px;
      transform: translateY(-1px);
    }

    .bottom-tabs {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: var(--tab-h);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 8px 14px 12px;
      gap: 8px;
      background: rgba(255, 253, 250, .92);
      border-top: 1px solid rgba(69, 59, 45, .12);
      backdrop-filter: blur(16px);
      z-index: 10;
    }

    .tab {
      border-radius: 8px;
      color: var(--muted);
      background: transparent;
      display: grid;
      place-items: center;
      gap: 2px;
      font-size: 11px;
      font-weight: 750;
    }

    .tab span {
      width: 22px;
      height: 18px;
      border-radius: 7px;
      border: 1.5px solid currentColor;
      display: block;
      position: relative;
    }

    .tab[data-tab="home"] span::after {
      content: "";
      position: absolute;
      left: 5px;
      right: 5px;
      bottom: 3px;
      height: 5px;
      border-radius: 4px;
      background: currentColor;
    }

    .tab[data-tab="memory"] span::after {
      content: "";
      position: absolute;
      width: 8px;
      height: 8px;
      left: 6px;
      top: 4px;
      border-radius: 50%;
      background: currentColor;
    }

    .tab[data-tab="mine"] span::after {
      content: "";
      position: absolute;
      left: 5px;
      right: 5px;
      bottom: 2px;
      height: 6px;
      border-radius: 6px 6px 3px 3px;
      background: currentColor;
    }

    .tab.active {
      color: var(--green-deep);
      background: rgba(126, 147, 102, .12);
    }

    .notice-list {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    .notice {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 10px;
      background: rgba(255, 253, 250, .74);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
    }

    .notice strong {
      display: block;
      font-size: 13px;
      margin-bottom: 3px;
    }

    .quick-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 9px;
      margin-top: 12px;
    }

    .action-tile {
      min-height: 72px;
      padding: 10px 6px;
      border-radius: 8px;
      background: rgba(255, 253, 250, .82);
      border: 1px solid var(--line);
      text-align: center;
      color: var(--ink);
      font-weight: 800;
      font-size: 13px;
    }

    .action-tile span {
      display: block;
      width: 22px;
      height: 22px;
      margin: 0 auto 7px;
      border-radius: 7px;
      border: 1.6px solid var(--green);
      position: relative;
    }

    .action-tile span::after {
      content: "";
      position: absolute;
      inset: 6px;
      border-radius: 50%;
      background: var(--green);
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
    }

    .thumb {
      aspect-ratio: 1;
      border-radius: 8px;
      background:
        linear-gradient(145deg, rgba(255, 253, 250, .24), transparent 44%),
        linear-gradient(180deg, var(--tile-a), var(--tile-b));
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 253, 250, .65);
    }

    .thumb::before {
      content: "";
      position: absolute;
      width: 42%;
      height: 42%;
      border-radius: 50%;
      left: 28%;
      top: 24%;
      background: rgba(68, 58, 49, .26);
      box-shadow: 0 22px 0 -11px rgba(68, 58, 49, .18);
    }

    .thumb.main::after {
      content: "主照片";
      position: absolute;
      left: 6px;
      top: 6px;
      padding: 3px 6px;
      border-radius: 999px;
      background: rgba(255, 253, 250, .8);
      color: var(--green-deep);
      font-size: 10px;
      font-weight: 800;
    }

    .hug-list {
      display: grid;
      gap: 8px;
    }

    .hug-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(69, 59, 45, .1);
    }

    .hug-item:last-child {
      border-bottom: 0;
    }

    .hug-mark {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(191, 125, 114, .16);
      border: 1px solid rgba(191, 125, 114, .26);
      position: relative;
      flex: 0 0 auto;
    }

    .hug-mark::before,
    .hug-mark::after {
      content: "";
      position: absolute;
      width: 11px;
      height: 18px;
      top: 8px;
      border-radius: 12px 12px 4px 4px;
      background: var(--rose);
    }

    .hug-mark::before {
      left: 8px;
      transform: rotate(-24deg);
    }

    .hug-mark::after {
      right: 8px;
      transform: rotate(24deg);
    }

    .list-row {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 10px;
      min-height: 54px;
      padding: 12px 0;
      border-bottom: 1px solid rgba(69, 59, 45, .1);
    }

    .list-row:last-child {
      border-bottom: 0;
    }

    .row-icon {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: rgba(126, 147, 102, .11);
      position: relative;
    }

    .row-icon::after {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      background: var(--green);
    }

    .chevron {
      color: rgba(46, 43, 39, .35);
      font-size: 20px;
    }

    .empty-state {
      text-align: center;
      padding: 26px 14px;
      border: 1px dashed rgba(82, 103, 68, .32);
      border-radius: 8px;
      background: rgba(255, 253, 250, .54);
    }

    .mini-divider {
      height: 1px;
      background: rgba(69, 59, 45, .11);
      margin: 12px 0;
    }

    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 13px 0;
      border-bottom: 1px solid rgba(69, 59, 45, .1);
    }

    .switch {
      width: 48px;
      height: 28px;
      border-radius: 999px;
      background: rgba(69, 59, 45, .18);
      padding: 3px;
      flex: 0 0 auto;
    }

    .switch.on {
      background: rgba(126, 147, 102, .52);
    }

    .switch span {
      display: block;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #fffdfa;
      box-shadow: 0 2px 8px rgba(40, 32, 22, .18);
      transition: transform .18s ease;
    }

    .switch.on span {
      transform: translateX(20px);
    }

    .h5-bar {
      margin: 10px 14px 0;
      padding: 8px 10px;
      border-radius: 999px;
      background: rgba(255, 253, 250, .74);
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .h5 .content {
      padding-top: 12px;
    }

    .h5 .planet-window {
      min-height: 340px;
      background:
        linear-gradient(180deg, rgba(39, 49, 68, .92), rgba(83, 114, 114, .85) 58%, rgba(149, 165, 124, .8)),
        #dfe8e4;
    }

    .modal-shade {
      position: absolute;
      inset: 0;
      background: rgba(33, 31, 28, .34);
      z-index: 30;
      display: flex;
      align-items: flex-end;
      padding: 14px;
    }

    .modal {
      width: 100%;
      background: var(--paper-soft);
      border-radius: 14px;
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, .75);
      box-shadow: 0 18px 50px rgba(33, 31, 28, .22);
      max-height: 78%;
      overflow-y: auto;
    }

    .toast {
      position: absolute;
      z-index: 40;
      top: 52px;
      left: 24px;
      right: 24px;
      padding: 11px 14px;
      border-radius: 999px;
      text-align: center;
      background: rgba(46, 43, 39, .9);
      color: #fffdfa;
      font-size: 13px;
      box-shadow: 0 10px 28px rgba(46, 43, 39, .22);
    }

    .debug-panel {
      align-self: stretch;
      max-height: 844px;
      overflow-y: auto;
      background: rgba(255, 253, 250, .78);
      border: 1px solid rgba(69, 59, 45, .14);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 12px 40px rgba(50, 42, 30, .1);
    }

    .debug-panel h2 {
      font-size: 18px;
      margin-bottom: 4px;
    }

    .debug-group {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid rgba(69, 59, 45, .12);
    }

    .debug-group label {
      display: block;
      font-size: 12px;
      font-weight: 800;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .debug-group select {
      width: 100%;
      height: 38px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #fffdfa;
      color: var(--ink);
      padding: 0 10px;
    }

    .debug-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .debug-buttons button {
      min-height: 36px;
      border-radius: 8px;
      background: rgba(126, 147, 102, .12);
      border: 1px solid rgba(126, 147, 102, .18);
      color: var(--green-deep);
      font-weight: 800;
      font-size: 12px;
    }

    .debug-state {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.6;
      background: rgba(255, 253, 250, .66);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
    }

    @media (max-width: 860px) {
      .workspace {
        grid-template-columns: 1fr;
        padding: 16px;
      }

      .phone {
        margin: 0 auto;
      }

      .debug-panel {
        max-height: none;
      }
    }
  </style>
</head>
<body>
  <div class="workspace">
    <div class="phone" aria-label="iPhone 移动端原型">
      <div class="screen">
        <div class="statusbar">
          <span>9:41</span>
          <span class="status-icons"><span class="signal"></span><span>5G</span><span class="battery"></span></span>
        </div>
        <main id="app"></main>
      </div>
    </div>
    <aside id="debug" class="debug-panel" aria-label="开发走查面板"></aside>
  </div>

  <script>
    // ===== Mock Data Model for Future Development =====
    //
    // User:
    // - userId
    // - loginStatus
    // - nickname
    //
    // Entitlement:
    // - entitlementType: free / paid
    // - purchaseStatus
    // - purchaseTime
    //
    // Pet:
    // - petId
    // - ownerUserId
    // - name
    // - type
    // - mainPhoto
    // - memorialSentence
    // - dates
    //
    // Story:
    // - storyId
    // - petId
    // - content
    //
    // Photo:
    // - photoId
    // - petId
    // - type: main / album
    // - url
    // - uploadStatus
    //
    // Letter:
    // - letterId
    // - petId
    // - title
    // - content
    // - createdAt
    //
    // Hug:
    // - hugId
    // - petId
    // - shareId
    // - visitorFingerprint
    // - createdAt
    //
    // Share:
    // - shareId
    // - petId
    // - visibility
    // - hugEnabled
    var state = {
      route: "home",
      modal: null,
      toast: "",
      ownerStage: "unboarded",
      visibility: "link",
      hugEnabled: true,
      contentLevel: "fresh",
      hugMoment: "none",
      photoState: "free-open",
      albumPhotoCount: 0,
      mainPhotoVersion: 0,
      uploadDone: false,
      visitorHug: "none",
      draftPetName: "棉花",
      selectedPetType: "猫猫",
      storyContent: "",
      photos: [],
      letters: [],
      hugs: [],
      share: {
        shareId: "share_mock_001",
        petId: "pet_mock_001",
        visibility: "link",
        hugEnabled: true,
        shareUrl: "share.xingyu.example/棉花"
      }
    };

    var navStack = [];

    var pet = {
      name: "棉花",
      type: "猫猫",
      sentence: "愿你在有风和阳光的地方，继续慢慢散步。",
      dates: "陪伴 2016 - 2025",
      defaultStory: "棉花喜欢趴在窗边晒太阳。每次听见钥匙声，都会慢慢走到门口，像是在确认家人都平安回来。后来我们才知道，原来那些安静的日子，一直都被TA认真陪着。"
    };

    var app = document.getElementById("app");
    var debug = document.getElementById("debug");

    function isCreated() {
      return state.ownerStage === "free" || state.ownerStage === "paid";
    }

    function isPaid() {
      return state.ownerStage === "paid";
    }

    function isRich() {
      return state.contentLevel === "rich";
    }

    function hasStory() {
      return state.storyContent.trim().length > 0;
    }

    function defaultStoryText() {
      return pet.defaultStory.replaceAll("棉花", pet.name);
    }

    function hugCount() {
      return state.hugs.length;
    }

    function photoLimit() {
      return isPaid() ? 50 : 9;
    }

    function photoCount() {
      if (!isCreated()) return 0;
      return Math.min(state.photos.length, photoLimit());
    }

    function syncAlbumPhotoCount() {
      state.albumPhotoCount = state.photos.length;
    }

    function makePhoto(index = state.photos.length + 1) {
      return {
        photoId: `photo_mock_${Date.now()}_${index}`,
        petId: "pet_mock_001",
        type: "album",
        createdAt: "刚刚",
        isMain: false
      };
    }

    function setMockPhotoCount(count) {
      const target = Math.max(0, Math.min(count, photoLimit()));
      state.photos = Array.from({ length: target }, (_, i) => ({
        photoId: `photo_mock_${i + 1}`,
        petId: "pet_mock_001",
        type: "album",
        createdAt: i === 0 ? "主照片之后" : "回忆照片",
        isMain: false
      }));
      syncAlbumPhotoCount();
      if (!isPaid() && state.photos.length >= 9) state.photoState = "free-full";
      if (!isPaid() && state.photos.length < 9 && state.photoState === "free-full") state.photoState = "free-open";
    }

    function syncShareState() {
      state.share.petId = "pet_mock_001";
      state.share.visibility = state.visibility;
      state.share.hugEnabled = state.hugEnabled;
      state.share.shareUrl = `share.xingyu.example/${encodeURIComponent(pet.name)}`;
    }

    function addMockHug(time = "刚刚") {
      const hug = {
        hugId: `hug_mock_${Date.now()}_${state.hugs.length + 1}`,
        petName: pet.name,
        time,
        visitorName: "匿名访客",
        source: "H5分享页",
        petId: "pet_mock_001",
        shareId: state.share.shareId,
        visitorFingerprint: "visitor_mock"
      };
      state.hugs.unshift(hug);
      state.hugMoment = "new";
      return hug;
    }

    function setHugMoment(value) {
      state.hugMoment = value;
      if (value === "new" && state.hugs.length === 0) addMockHug("刚刚");
      if (value === "none") state.hugs = [];
      render();
    }

    function setContentLevel(value) {
      state.contentLevel = value;
      if (value === "rich") {
        if (!hasStory()) state.storyContent = defaultStoryText();
        if (state.photos.length < 6) setMockPhotoCount(isPaid() ? 18 : 6);
      } else {
        state.storyContent = "";
        state.photos = [];
        syncAlbumPhotoCount();
      }
      render();
    }

    function go(route, options = {}) {
      if (!options.replace && state.route !== route) navStack.push(state.route);
      state.route = route;
      state.modal = null;
      state.toast = "";
      render();
    }

    function back(fallback = "home") {
      state.route = navStack.pop() || fallback;
      state.modal = null;
      render();
    }

    function openModal(name) {
      state.modal = name;
      render();
    }

    function closeModal() {
      state.modal = null;
      render();
    }

    function showToast(message) {
      state.toast = message;
      render();
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => {
        state.toast = "";
        render();
      }, 1800);
    }

    function setOwnerStage(value) {
      state.ownerStage = value;
      if (value === "unboarded") {
        state.route = "home";
        state.uploadDone = false;
        state.photoState = "free-open";
        state.photos = [];
        syncAlbumPhotoCount();
        state.visitorHug = "none";
        state.hugs = [];
        state.visibility = "link";
        state.hugEnabled = true;
      }
      if (value === "paid") {
        state.photoState = "paid";
      }
      if (value === "free" && state.photoState === "paid") state.photoState = "free-open";
      render();
    }

    function setPhotoState(value) {
      state.photoState = value;
      if (value === "paid") {
        state.ownerStage = "paid";
      }
      if (value === "free-full") {
        state.ownerStage = "free";
        setMockPhotoCount(9);
      }
      if (value === "free-open") {
        if (state.ownerStage === "paid") state.ownerStage = "free";
        if (state.photos.length > 8) setMockPhotoCount(6);
      }
      render();
    }

    function startCreate() {
      go("onboardingStart");
    }

    function creationStep(current, title) {
      return `
        <div class="small" style="font-weight:800;color:var(--green-deep);margin-bottom:8px;">${current}/3 ${title}</div>
        <div class="progress">${[1, 2, 3].map(i => `<span class="${i <= current ? "on" : ""}"></span>`).join("")}</div>
      `;
    }

    function petTypeOptions() {
      return ["猫猫", "狗狗", "其他小动物"].map(type => `<button class="choice ${state.selectedPetType === type ? "active" : ""}" onclick="state.selectedPetType='${type}'; pet.type='${type}'; render()">${type}</button>`).join("");
    }

    function petPhoto(className = "", inlineStyle = "") {
      const hue = (state.mainPhotoVersion % 6) * 10;
      const cls = className ? ` ${className}` : "";
      const style = `${inlineStyle ? inlineStyle + ";" : ""}--photo-hue:${hue}deg`;
      return `<div class="pet-photo${cls}" style="${style}"></div>`;
    }

    function submitPetInfo() {
      const input = document.getElementById("petNameInput");
      const nextName = input ? input.value.trim() : "";
      if (!nextName) {
        showToast("请先写下TA的名字");
        return;
      }
      pet.name = nextName;
      pet.type = state.selectedPetType;
      state.draftPetName = nextName;
      syncShareState();
      go("mainPhoto");
    }

    function simulateUpload(status) {
      if (status === "video") {
        showToast("V1暂时只支持图片上传，视频回忆会在后续版本考虑。");
        return;
      }
      if (status === "fail") {
        showToast("这张照片暂时没能保存，请重新试一次");
        return;
      }
      state.uploadDone = true;
      state.mainPhotoVersion += 1;
      showToast("照片已作为TA的主照片");
    }

    function chooseFreeTier() {
      state.ownerStage = "free";
      state.photoState = "free-open";
      state.visibility = "link";
      state.hugEnabled = true;
      state.contentLevel = "fresh";
      state.hugMoment = "none";
      state.visitorHug = "none";
      state.photos = [];
      syncAlbumPhotoCount();
      state.storyContent = "";
      state.letters = [];
      state.hugs = [];
      syncShareState();
      go("createSuccess");
    }

    function paySuccess() {
      const wasCreated = isCreated();
      state.ownerStage = "paid";
      state.photoState = "paid";
      state.visibility = "link";
      state.hugEnabled = true;
      state.modal = null;
      if (!wasCreated) {
        state.contentLevel = "fresh";
        state.hugMoment = "none";
        state.visitorHug = "none";
        state.photos = [];
        syncAlbumPhotoCount();
        state.storyContent = "";
        state.letters = [];
        state.hugs = [];
        syncShareState();
        go("createSuccess");
      } else {
        syncShareState();
        render();
        showToast("完整纪念空间已开启");
      }
    }

    function payFail() {
      state.modal = null;
      go("paymentFail");
    }

    function upgradeNow() {
      state.ownerStage = "paid";
      state.photoState = "paid";
      syncShareState();
      showToast("完整纪念空间已开启");
    }

    function saveStory() {
      const input = document.getElementById("storyInput");
      const nextStory = input ? input.value.trim() : "";
      if (!nextStory) {
        state.storyContent = "";
        go("memory");
        showToast("可以从一件小事开始，之后再慢慢写");
        return;
      }
      state.storyContent = nextStory;
      state.contentLevel = "rich";
      go("memory");
      showToast("TA的故事已保存");
    }

    function storyText() {
      return state.storyContent;
    }

    function saveLetter() {
      const titleInput = document.getElementById("letterTitleInput");
      const contentInput = document.getElementById("letterContentInput");
      const title = titleInput ? titleInput.value.trim() : "";
      const content = contentInput ? contentInput.value.trim() : "";
      if (!content) {
        showToast("可以先写下一点想说的话");
        return;
      }
      state.letters.unshift({
        letterId: `letter_mock_${Date.now()}_${state.letters.length + 1}`,
        petId: "pet_mock_001",
        title: title || "写给TA的话",
        content,
        createdAt: "刚刚保存",
        visibility: "private"
      });
      go("mailbox");
      showToast("这封信已留在这里");
    }

    function saveSentence() {
      const input = document.getElementById("sentenceInput");
      const nextSentence = input ? input.value.trim() : "";
      if (!nextSentence) {
        showToast("可以先写下一句想留给TA的话");
        return;
      }
      pet.sentence = nextSentence;
      state.modal = null;
      render();
      showToast("纪念语已保存");
    }

    function savePetProfile() {
      const nameInput = document.getElementById("profilePetName");
      const typeInput = document.getElementById("profilePetType");
      const nextName = nameInput ? nameInput.value.trim() : "";
      if (!nextName) {
        showToast("请先写下TA的名字");
        return;
      }
      pet.name = nextName;
      pet.type = typeInput ? typeInput.value : pet.type;
      state.draftPetName = pet.name;
      state.selectedPetType = pet.type;
      syncShareState();
      showToast("资料已保存");
    }

    function canAddAlbumPhoto() {
      return isCreated() && photoCount() < photoLimit();
    }

    function simulateAlbumUpload(status) {
      if (status === "fail") {
        showToast("这张照片暂时没能保存，请重新试一次");
        return;
      }
      if (!canAddAlbumPhoto()) {
        openModal("photoLimit");
        return;
      }
      state.photos.push(makePhoto());
      syncAlbumPhotoCount();
      if (!isPaid() && state.photos.length >= 9) state.photoState = "free-full";
      if (state.photos.length > 0) state.contentLevel = "rich";
      state.modal = null;
      render();
      showToast("照片已加入相册");
    }

    function addPhoto() {
      if (!canAddAlbumPhoto()) {
        openModal("photoLimit");
        return;
      }
      openModal("photoUpload");
    }

    function hugPet() {
      if (state.visitorHug === "hugged") {
        go("h5Repeat");
        return;
      }
      state.visitorHug = "hugged";
      addMockHug("刚刚");
      go("h5Success");
    }

    function changePrivateAndShare() {
      state.visibility = "link";
      syncShareState();
      openModal("share");
    }

    function setVisibility(value) {
      state.visibility = value;
      syncShareState();
      render();
    }

    function setHugEnabled(value) {
      state.hugEnabled = value;
      syncShareState();
      render();
    }

    function ensureCreatedForWalkthrough(paid = false) {
      if (!isCreated()) state.ownerStage = paid ? "paid" : "free";
      if (paid) state.ownerStage = "paid";
      state.photoState = state.ownerStage === "paid" ? "paid" : (state.photoState === "paid" ? "free-open" : state.photoState);
      state.uploadDone = true;
      syncAlbumPhotoCount();
    }

    function walkthroughReset() {
      state.ownerStage = "unboarded";
      state.route = "home";
      state.uploadDone = false;
      state.photos = [];
      syncAlbumPhotoCount();
      state.photoState = "free-open";
      state.modal = null;
      state.visitorHug = "none";
      state.hugMoment = "none";
      state.hugs = [];
      state.visibility = "link";
      state.hugEnabled = true;
      state.storyContent = "";
      state.letters = [];
      syncShareState();
      render();
    }

    function walkthroughFullExample() {
      state.ownerStage = "free";
      state.contentLevel = "rich";
      state.storyContent = state.storyContent || defaultStoryText();
      if (state.photos.length < 6) setMockPhotoCount(6);
      state.photoState = "free-open";
      state.visibility = "link";
      state.hugEnabled = true;
      syncShareState();
      state.route = "home";
      render();
    }

    function walkthroughFreePhotoFull() {
      state.ownerStage = "free";
      state.photoState = "free-full";
      setMockPhotoCount(9);
      state.route = "album";
      render();
    }

    function walkthroughPaidMailbox() {
      state.ownerStage = "paid";
      state.photoState = "paid";
      state.route = "mailbox";
      render();
    }

    function walkthroughH5Success() {
      ensureCreatedForWalkthrough(false);
      state.visibility = "link";
      state.hugEnabled = true;
      state.visitorHug = "hugged";
      addMockHug("刚刚");
      syncShareState();
      go("h5Success");
    }

    function walkthroughH5Repeat() {
      ensureCreatedForWalkthrough(false);
      state.visibility = "link";
      state.hugEnabled = true;
      state.visitorHug = "hugged";
      syncShareState();
      go("h5Repeat");
    }

    function walkthroughH5Inaccessible() {
      ensureCreatedForWalkthrough(false);
      state.visibility = "private";
      syncShareState();
      go("h5");
    }

    function tabs(active) {
      return `
        <nav class="bottom-tabs" aria-label="底部导航">
          <button class="tab ${active === "home" ? "active" : ""}" data-tab="home" onclick="go('home')"><span></span>首页</button>
          <button class="tab ${active === "memory" ? "active" : ""}" data-tab="memory" onclick="go('${isCreated() ? "memory" : "memoryGuide"}')"><span></span>回忆</button>
          <button class="tab ${active === "mine" ? "active" : ""}" data-tab="mine" onclick="go('mine')"><span></span>我的</button>
        </nav>
      `;
    }

    function nav(title, right = "") {
      return `
        <div class="nav">
          <button class="icon-btn" onclick="back()" aria-label="返回">‹</button>
          <div class="nav-title">${title}</div>
          <div>${right}</div>
        </div>
      `;
    }

    function shell(content, options = {}) {
      const tabMarkup = options.tab ? tabs(options.tab) : "";
      const h5Class = options.h5 ? " h5" : "";
      const tabClass = options.tab ? " with-tabs" : "";
      return `
        <section class="page${h5Class}${tabClass}">
          ${options.nav ? nav(options.nav, options.right || "") : ""}
          ${options.h5Bar ? `<div class="h5-bar">${state.share.shareUrl}</div>` : ""}
          <div class="content">${content}</div>
        </section>
        ${tabMarkup}
        ${state.toast ? `<div class="toast">${state.toast}</div>` : ""}
        ${modal()}
      `;
    }

    function createdHome() {
      const extraCards = [];
      const latestHug = state.hugs[0];
      if (state.hugMoment === "new" && latestHug) {
        extraCards.push(`
          <div class="notice">
            <div><strong>${latestHug.visitorName}刚刚抱抱了${latestHug.petName}</strong><p class="small">这份心意已经留在TA的星球里。</p></div>
            <button class="secondary" onclick="go('hugs')">查看抱抱</button>
          </div>
        `);
      }
      if (!isRich()) {
        extraCards.push(`
          <div class="notice">
            <div><strong>还有一些回忆，可以慢慢留下</strong><p class="small">关于TA的故事，可以慢慢留下。</p></div>
            <button class="secondary" onclick="go('memory')">继续</button>
          </div>
        `);
      }
      if (!isPaid()) {
        extraCards.push(`
          <div class="notice">
            <div><strong>当前是免费纪念空间</strong><p class="small">想保存更多照片、写信给TA时，可以再了解完整纪念空间。</p></div>
            <button class="ghost" onclick="go('entitlement')">了解</button>
          </div>
        `);
      }

      return shell(`
        <div class="logo-row">
          <div class="brand">星屿纪念</div>
          <div class="soft-tag">${isPaid() ? "完整纪念空间" : "免费纪念空间"}</div>
        </div>
        <p class="muted">今天也来看看TA。</p>
        <div class="section planet-window">
          ${petPhoto()}
          <div class="planet-caption">
            <div class="name">${pet.name}</div>
            <div class="line">${pet.sentence}</div>
          </div>
        </div>
        <div class="button-row">
          <button class="primary wide" onclick="go('memory')">进入TA的回忆</button>
          <button class="secondary" onclick="addPhoto()">放一张照片</button>
          <button class="secondary" onclick="${isPaid() ? "go('mailbox')" : "go('mailboxLocked')"}">写给TA的话</button>
        </div>
        <div class="notice-list">${extraCards.join("")}</div>
      `, { tab: "home" });
    }

    function unboardedHome() {
      return shell(`
        <div class="logo-row">
          <div class="brand">星屿纪念</div>
          <div class="soft-tag">内测体验</div>
        </div>

    function photoThumbs(count) {
      const colors = [
        ["#d9c5aa", "#93aa92"],
        ["#d7e0dc", "#7c9db0"],
        ["#edd8c1", "#b78a78"],
        ["#d2d8bd", "#7d9566"],
        ["#e6dfcf", "#9fb8aa"],
        ["#cfd7e2", "#7d8aa2"],
        ["#ead3c8", "#a98972"],
        ["#d8e2d7", "#749378"],
        ["#e8e4d5", "#b5a26f"]
      ];
      return Array.from({ length: count }, (_, i) => {
        const c = colors[i % colors.length];
        return `<div class="thumb ${i === 0 ? "main" : ""}" style="--tile-a:${c[0]};--tile-b:${c[1]}"></div>`;
      }).join("");
