name: MemorialApp
options:
  bundleIdPrefix: com.musayang
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: 5.0
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_HARDENED_RUNTIME: YES

targets:
  MemorialApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MemorialApp/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.musayang.memorial
        PRODUCT_NAME: MemorialApp
        INFOPLIST_FILE: MemorialApp/Sources/App/Info.plist
        DEVELOPMENT_TEAM: ""
    info:
      path: MemorialApp/Sources/App/Info.plist
      properties:
        CFBundleDisplayName: 星屿纪念
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        NSPhotoLibraryUsageDescription: 需要访问相册以上传宠物照片
        NSPhotoLibraryAddUsageDescription: 需要访问相册以保存分享图片
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: MemorialApp/Sources/App/MemorialApp.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
